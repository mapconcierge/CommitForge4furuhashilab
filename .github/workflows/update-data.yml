name: Update contributions data

on:
  schedule:
    # 毎日 JST 0:00 (UTC 15:00) に実行
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data/contributions.json; then
            echo "No changes in contributions.json"
            exit 0
          fi
          git add docs/data/contributions.json
          git commit -m "chore: update contributions data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
